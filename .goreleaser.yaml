version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: sancho

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  use: github-native

brews:
  - name: sancho
    # main on homebrew-tap is protected (PR-only), so the formula update
    # is pushed to a branch and opened as a pull request instead.
    repository:
      owner: MarioAer
      name: homebrew-tap
      branch: "sancho-{{ .Version }}"
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: MarioAer
          name: homebrew-tap
          branch: main
    directory: Formula
    homepage: "https://github.com/MarioAer/sancho"
    description: "CLI for delegating coding tasks to LLMs"
